title: "The Drift 8B-44"
description: "Community field guide, character registry, experience archive, and documentation for The Drift."
url: "https://iamcapote.github.io"
baseurl: "/8B44"

markdown: kramdown
highlighter: rouge
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  characters:
    output: true
    permalink: /characters/:name/
  experiences:
    output: true
    permalink: /experiences/:name/
  tips:
    output: true
    permalink: /tips/:name/

defaults:
  - scope:
      path: ""
      type: characters
    values:
      layout: entry
      entry_type: Character
  - scope:
      path: ""
      type: experiences
    values:
      layout: entry
      entry_type: Experience
  - scope:
      path: ""
      type: tips
    values:
      layout: entry
      entry_type: Tip
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - .jekyll-cache
  - _site
  - templates
